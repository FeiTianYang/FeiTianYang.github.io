<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你想要的卡片标题</title>
  <meta name="description" content="你想要的卡片描述">

  <!-- 微信、QQ、微博等会优先抓这些 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="你想要的卡片标题">
  <meta property="og:description" content="你想要的卡片描述">
  <meta property="og:image" content="https://你的域名/图片.jpg">
  <meta property="og:image:secure_url" content="https://你的域名/图片.jpg">
  <meta property="og:image:width" content="500">
  <meta property="og:image:height" content="400">
  <meta property="og:url" content="https://你的域名/">

  <!-- 备用抓取标签 -->
  <link rel="image_src" href="https://你的域名/图片.jpg">
  <meta itemprop="image" content="https://你的域名/图片.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="你想要的卡片标题">
  <meta name="twitter:description" content="你想要的卡片描述">
  <meta name="twitter:image" content="https://你的域名/图片.jpg">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .wrap {
      width: 100%;
      max-width: 600px;
      background: #fff;
    }
    .wrap img {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://你的域名/图片.jpg" alt="图片">
  </div>
</body>
</html>
